[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2pa-scanner"
version = "0.4.1"
description = "Detect C2PA provenance / AI-generated images in website sitemaps (EU AI Act Art. 50)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Blaess" }]
dependencies = [
    "c2pa-python>=0.36",
    "Pillow>=10.0",
    "cryptography>=42.0",
    "httpx>=0.25",
    "playwright>=1.40",
    "textual>=0.80",
    "rich>=13.0",
    "textual-image[textual]>=0.12.0",
    "textual-fspicker>=1.0",
    "textual-themes @ git+https://github.com/michaelblaess/textual-themes.git",
    "textual-widgets @ git+https://github.com/michaelblaess/textual-widgets.git",
    "textual-slider>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.6",
    "poethepoet>=0.27",
]

[project.scripts]
c2pa-scanner = "c2pa_scanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c2pa_scanner = ["locale/*.json", "*.tcss"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["c2pa.*", "textual_widgets.*", "textual_themes.*", "textual_image.*", "textual_fspicker.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.poe.tasks]
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"
test = "pytest"
check = ["lint", "typecheck", "test"]
